<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Theater Club Verification</title>
    <style>
        body {
            background: url(https://i.pinimg.com/736x/4a/1a/09/4a1a092d802c04994e8cca91b632f28c.jpg) no-repeat center center fixed;
            background-size: cover;
            color: #f8f9fa;
            text-align: center;
        }
        h1 {
            color: #ffffff;
            font-weight: bold;
        }
        label {
            color: #f8f9fa;
        }
        .form-control {
            background-color: #212121;
            color: #ffffff;
            border: 1px solid #f9f9f9;
        }
        .form-control {
            background-color: #212121;
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 5px rgba(220, 53, 69, 0.5);
        }
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #501017;
            border-color: #a52834;
        }
        #output1 {
            border: 5px solid #dc3545;
            box-shadow: 0px 5px 15px rgba(220, 53, 69, 0.3); 
            height: 150px;
            border-radius: 10px;
            font-size: 20px;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="container mt-5" style="max-width: 500px;">
        <h1 class="mb-4">Theatre Club Verification</h1>
        <form action="">
            <div class="mb-3 text-start">
                <label for="firstname" class="form-label">First Name</label>
                <input type="text" id="firstname" class="form-control" placeholder="Enter first name" required>
            </div>

            <div class="mb-3 text-start">
                <label for="lastname" class="form-label">Last Name</label>
                <input type="text" id="lastname" class="form-control" placeholder="Enter last name" required>
            </div>

            <button type="button" class="btn btn-danger w-100" py-click="checkmember">Check Candidate</button>
        </form>
        <div id="output1"></div>
    </div>
    <script type="py" src="main.py"></script>
</body>
</html>
